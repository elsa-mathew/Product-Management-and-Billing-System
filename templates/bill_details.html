<h2>All Bills</h2>

<table border="1">
    <tr>
        <th>Bill ID</th>
        <th>Total</th>
        <th>Action</th>
    </tr>

    {% for bill in bills %}
    <tr>
        <td>{{ bill.id }}</td>
        <td>{{ bill.total }}</td>
        <td>
            <a href="/billing/view/{{ bill.id }}">View</a>
        </td>
    </tr>
    {% endfor %}
</table>
