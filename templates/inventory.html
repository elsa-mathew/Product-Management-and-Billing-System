{% extends 'admin_base.html' %}

{% block content %}

<h2>Inventory</h2>

{% for section in data %}

<h3>{{ section.category.name }}</h3>

<table border="1">
<tr>
    <th>Product</th>
    <th>Quantity</th>
    <th>Actions</th>
</tr>

{% for item in section.items %}
<tr>
    <td>{{ item.product.name }}</td>
    <td>{{ item.quantity }}</td>
    <td>
        <a href="/inventory/?add={{ item.id }}">+</a>
        <a href="/inventory/?remove={{ item.id }}">-</a>
    </td>
</tr>
{% empty %}
<tr>
    <td colspan="3">No Products</td>
</tr>
{% endfor %}

</table>

<br>

{% endfor %}

{% endblock %}
